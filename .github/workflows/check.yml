name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # bb check compares released versions with the previous release tag
      - uses: turtlequeue/setup-babashka@v1.8.1
        with:
          babashka-version: 1.13.229
      - run: bb check
